<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Scheda contatto · Giro</title>
<style>
  :root { color-scheme: dark light; --bg:#1a1200; --fg:#f5ecd6; --mut:#b9ad8f; --card:#2a2000; --acc:#f5a800; }
  @media (prefers-color-scheme: light) { :root { --bg:#fffaf0; --fg:#1b1b1f; --mut:#6b6455; --card:#fff; --acc:#b87800; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"DM Sans",system-ui,sans-serif; display:flex; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; }
  .card { background:var(--card); border-radius:18px; padding:24px 20px; text-align:center; box-shadow:0 2px 12px #0003; }
  .avatar { width:112px; height:112px; border-radius:50%; object-fit:cover; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; font-size:48px; margin:0 auto 12px; }
  h1 { margin:4px 0 2px; font-size:24px; }
  .nick { color:var(--mut); margin-bottom:16px; }
  .links { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .links a { display:block; padding:11px 14px; border-radius:12px; background:#8881; color:var(--fg); text-decoration:none; font-weight:600; border:1px solid #8883; }
  .site { display:block; text-align:center; margin-top:20px; color:var(--acc); font-weight:600; text-decoration:none; }
  .msg { text-align:center; color:var(--mut); padding:40px 10px; }
</style>
</head>
<body>
<main id="root"><div class="msg">Caricamento…</div></main>
<script src="i18n.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const LABEL = { whatsapp:"WhatsApp", telegram:"Telegram", strava:"Strava", komoot:"Komoot", garmin:"Garmin",
  instagram:"Instagram", facebook:"Facebook", youtube:"YouTube", tiktok:"TikTok" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function linkUrl(key, raw) {
  const v = String(raw || "").trim();
  if (/^https?:\/\//i.test(v)) return v;
  const h = v.replace(/^@/, "");
  switch (key) {
    case "whatsapp": return "https://wa.me/" + v.replace(/\D/g, "");
    case "telegram": return "https://t.me/" + h;
    case "strava": return "https://www.strava.com/athletes/" + h;
    case "komoot": return "https://www.komoot.com/user/" + h;
    case "garmin": return "https://connect.garmin.com/modern/profile/" + h;
    case "instagram": return "https://www.instagram.com/" + h;
    case "facebook": return "https://www.facebook.com/" + h;
    case "youtube": return "https://www.youtube.com/@" + h;
    case "tiktok": return "https://www.tiktok.com/@" + h;
    default: return v.includes(".") ? "https://" + v : v;
  }
}
const safe = (u) => /^(https?:|tel:|mailto:)/i.test(u) ? u : "#";

const root = document.getElementById("root");
const q = new URLSearchParams(location.search);
const code = (q.get("c") || "").toUpperCase(), uid = q.get("u") || "";
const site = `<a class="site" href="/">Apri Giro →</a>`;

try {
  if (!code || !uid) throw new Error("bad");
  const db = getFirestore(initializeApp(firebaseConfig));
  const snap = await getDoc(doc(db, "calendars", code, "contacts", uid));
  if (!snap.exists() || snap.data().shared !== true) throw new Error("none");
  const c = snap.data();
  const name = `${c.nome || ""} ${c.cognome || ""}`.trim();
  document.title = `${name} · Giro`;
  const avatar = c.photoData
    ? `<img class="avatar" alt="" src="data:image/jpeg;base64,${esc(c.photoData)}">`
    : `<div class="avatar">${esc((c.nome || "?").slice(0, 1).toUpperCase())}</div>`;
  const links = [];
  if (c.phone) links.push(`<a href="${esc(safe("tel:" + c.phone.trim()))}">📞 ${esc(c.phone)}</a>`);
  if (c.email) links.push(`<a href="${esc(safe("mailto:" + c.email.trim()))}">✉️ ${esc(c.email)}</a>`);
  for (const [k, v] of Object.entries(c.links || {})) {
    if (String(v).trim()) links.push(`<a href="${esc(safe(linkUrl(k, v)))}" rel="noopener">${esc(LABEL[k] || k)}</a>`);
  }
  if (c.altroUrl) links.push(`<a href="${esc(safe(linkUrl("altro", c.altroUrl)))}" rel="noopener">${esc(c.altroLabel || "Altro")}</a>`);
  root.innerHTML = `<div class="card">${avatar}<h1>${esc(name)}</h1>
    <div class="nick">${c.soprannome ? "“" + esc(c.soprannome) + "”" : ""}</div>
    <div class="links">${links.join("")}</div></div>${site}`;
} catch (e) {
  root.innerHTML = `<div class="msg">Scheda non disponibile o non più condivisa.</div>${site}`;
}
</script>
<script>
  addEventListener("load", function () { setTimeout(function () { try {
    var bytes = 0; performance.getEntriesByType("navigation").concat(performance.getEntriesByType("resource")).forEach(function (e) { bytes += e.transferSize || 0; });
    var fresh = 0; try { if (!sessionStorage.getItem("gc_sess")) { sessionStorage.setItem("gc_sess", "1"); fresh = 1; } } catch (e) {}
    fetch("/api/hit", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ s: fresh, b: bytes, p: "scheda" }) }).catch(function () {});
  } catch (e) {} }, 3000); });
</script>
</body>
</html>
