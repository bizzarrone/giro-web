<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Statistiche · Giro</title>
<style>
  :root { color-scheme: dark light; --bg:#1a1200; --fg:#f5ecd6; --mut:#b9ad8f; --card:#2a2000; --acc:#f5a800; --line:#8883; }
  @media (prefers-color-scheme: light) { :root { --bg:#fffaf0; --fg:#1b1b1f; --mut:#6b6455; --card:#fff; --acc:#b87800; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"DM Sans",system-ui,sans-serif; padding:20px 14px; }
  main { max-width:960px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:26px; } h2 { margin:22px 0 8px; font-size:17px; color:var(--acc); }
  .mut { color:var(--mut); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .kpi b { display:block; font-size:26px; } .kpi span { color:var(--mut); font-size:12px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); } th { color:var(--mut); font-weight:600; font-size:12px; }
  td.n, th.n { text-align:right; }
  .bar { height:10px; background:var(--acc); border-radius:5px; min-width:2px; }
  button { background:var(--acc); color:#1a1200; border:0; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; font-size:15px; }
  .msg { padding:40px 10px; text-align:center; color:var(--mut); }
</style>
</head>
<body>
<main id="root"><div class="msg">Caricamento…</div></main>
<script type="module" src="stats.js"></script>
</body>
</html>
